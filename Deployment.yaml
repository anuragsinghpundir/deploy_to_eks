apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: 058264231631.dkr.ecr.ap-south-1.amazonaws.com/deploy_to_eks:latest
        ports:
          - containerPort: 80
